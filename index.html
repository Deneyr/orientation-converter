<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orientation Converter</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <form id="monForm">
    <h1>Euler ↔ Quaternion Converter</h1>
    <div class="layout">

      <div class="leftColumn">

        <!-- ========================= -->
        <!-- PANEL -->
        <!-- ========================= -->

        <div class="panel">

          <!-- INPUT -->

          <div class="card">

            <h2>Input</h2>

            <label>Type</label>

            <select id="inputType">
              <option value="euler">Euler</option>
              <option value="quaternion">Quaternion</option>
            </select>

            <!-- EULER INPUT -->

            <div id="eulerInputFields">

              <label>Intrinsic order</label>

              <select id="order">
                <option selected>ZYX</option>
                <option>ZXY</option>
                <option>YZX</option>
                <option>YXZ</option>
                <option>XZY</option>
                <option>XYZ</option>
              </select>

              <div class="orderHint" id="orderHint">
                ZYX (z y' x'')
              </div>

              <div>
                <label>X</label>
                <input class="only-number" id="ex" type="number" value="0" step="0.1" />
              </div>
              <div>
                <label>Y</label>
                <input class="only-number" id="ey" type="number" value="0" step="0.1" />
              </div>
              <div>
                <label>Z</label>
                <input class="only-number" id="ez" type="number" value="0" step="0.1" />
              </div>

              <div class="unit-selector">

                <label class="radio-option">
                  <input type="radio" name="angleUnit" value="deg" checked />
                  <span>Degrees</span>
                </label>

                <label class="radio-option">
                  <input type="radio" name="angleUnit" value="rad" />
                  <span>Radians</span>
                </label>

              </div>

            </div>

            <!-- QUAT INPUT -->

            <div id="quatInputFields" style="display:none">

              <div>
                <label>qx</label>
                <input id="qx" type="number" value="0" step="0.001" />
              </div>
              <div>
                <label>qy</label>
                <input id="qy" type="number" value="0" step="0.001" />
              </div>
              <div>
                <label>qz</label>
                <input id="qz" type="number" value="0" step="0.001" />
              </div>
              <div>
                <label>qw</label>
                <input id="qw" type="number" value="1" step="0.001" />
              </div>
            </div>
          </div>

          <button id="convertBtn">
            Convert
          </button>

          <!-- OUTPUT -->

          <div class="card">

            <h2>Output</h2>

            <label>Type</label>

            <select id="outputType">
              <option value="euler">Euler</option>
              <option value="quaternion" selected>Quaternion (Normalized)</option>
            </select>

            <!-- EULER OUTPUT -->

            <div id="eulerOutputFields" style="display:none">
              <div>
                <label>X</label>
                <input id="outEx" readonly />
              </div>
              <div>
                <label>Y</label>
                <input id="outEy" readonly />
              </div>
              <div>
                <label>Z</label>
                <input id="outEz" readonly />
              </div>
            </div>

            <!-- QUAT OUTPUT -->

            <div id="quatOutputFields">
              <div>
                <label>qx</label>
                <input id="outQx" readonly />
              </div>
              <div>
                <label>qy</label>
                <input id="outQy" readonly />
              </div>
              <div>
                <label>qz</label>
                <input id="outQz" readonly />
              </div>
              <div>
                <label>qw</label>
                <input id="outQw" readonly />
              </div>
            </div>

          </div>

        </div>

        <!-- VIEW -->

      </div>

      <div id="viewer"></div>

    </div>

    <script type="module" src="script.js"></script>
  </form>
</body>

</html>
