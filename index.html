<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orientation Converter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <form id="monForm" novalidate>

    <h1>Orientation Converter <span class="h1-sub">Euler · Quaternion · Axis-Angle · Matrix</span></h1>

    <div class="layout">

      <!-- =================== LEFT COLUMN =================== -->
      <div class="leftColumn">
        <div class="panel">

          <!-- TOP ROW : Input | Output -->
          <div class="top-row">

            <!-- ===== INPUT CARD ===== -->
            <div class="card card-half input-card">
              <h2>Input</h2>

              <!-- Type selector -->
              <div class="input-block">
                <div class="input-block-title">
                  <span class="output-badge badge-type">T</span>
                  Type
                </div>
                <select id="inputType">
                  <option value="euler">Euler</option>
                  <option value="quaternion">Quaternion</option>
                  <option value="axisangle">Axis-Angle</option>
                  <option value="matrix">Rotation Matrix</option>
                </select>
              </div>

              <div class="input-divider"></div>

              <!-- EULER INPUT -->
              <div id="eulerInputFields" class="input-block">
                <div class="input-block-title">
                  <span class="output-badge badge-euler">E</span>
                  Euler
                  <select id="order" class="out-order-select">
                    <option selected>ZYX</option>
                    <option>ZXY</option>
                    <option>YZX</option>
                    <option>YXZ</option>
                    <option>XZY</option>
                    <option>XYZ</option>
                  </select>
                  <span class="orderHint" id="orderHint">Intrinsic order (z y' x'')</span>
                  <div class="out-unit-toggle">
                    <label class="out-radio"><input type="radio" name="angleUnit" value="deg" checked /><span>deg</span></label>
                    <label class="out-radio"><input type="radio" name="angleUnit" value="rad" /><span>rad</span></label>
                  </div>
                </div>
                <div class="output-grid-3">
                  <div class="out-field"><label>X</label><input class="in-val" id="ex" type="number" value="0" step="0.1" /></div>
                  <div class="out-field"><label>Y</label><input class="in-val" id="ey" type="number" value="0" step="0.1" /></div>
                  <div class="out-field"><label>Z</label><input class="in-val" id="ez" type="number" value="0" step="0.1" /></div>
                </div>
              </div>

              <!-- QUATERNION INPUT -->
              <div id="quatInputFields" class="input-block" style="display:none">
                <div class="input-block-title">
                  <span class="output-badge badge-quat">Q</span>
                  Quaternion
                </div>
                <div class="output-grid-4">
                  <div class="out-field"><label>qx</label><input class="in-val" id="qx" type="number" value="0" step="0.001" /></div>
                  <div class="out-field"><label>qy</label><input class="in-val" id="qy" type="number" value="0" step="0.001" /></div>
                  <div class="out-field"><label>qz</label><input class="in-val" id="qz" type="number" value="0" step="0.001" /></div>
                  <div class="out-field"><label>qw</label><input class="in-val" id="qw" type="number" value="1" step="0.001" /></div>
                </div>
              </div>

              <!-- AXIS-ANGLE INPUT -->
              <div id="aaInputFields" class="input-block" style="display:none">
                <div class="input-block-title">
                  <span class="output-badge badge-aa">A</span>
                  Axis-Angle
                  <div class="out-unit-toggle">
                    <label class="out-radio"><input type="radio" name="inAngleUnitAA" value="deg" checked /><span>deg</span></label>
                    <label class="out-radio"><input type="radio" name="inAngleUnitAA" value="rad" /><span>rad</span></label>
                  </div>
                </div>
                <div class="output-grid-4">
                  <div class="out-field"><label>ax</label><input class="in-val" id="inAx" type="number" value="0" step="0.01" /></div>
                  <div class="out-field"><label>ay</label><input class="in-val" id="inAy" type="number" value="0" step="0.01" /></div>
                  <div class="out-field"><label>az</label><input class="in-val" id="inAz" type="number" value="1" step="0.01" /></div>
                  <div class="out-field"><label>θ</label><input class="in-val" id="inAngle" type="number" value="0" step="1" /></div>
                </div>
              </div>

              <!-- MATRIX INPUT -->
              <div id="matInputFields" class="input-block" style="display:none">
                <div class="input-block-title">
                  <span class="output-badge badge-mat">M</span>
                  Rotation Matrix <span class="output-sub">3×3</span>
                </div>
                <div class="output-matrix">
                  <div class="matrix-row">
                    <input class="in-val" id="im00" type="number" value="1" step="0.001" />
                    <input class="in-val" id="im01" type="number" value="0" step="0.001" />
                    <input class="in-val" id="im02" type="number" value="0" step="0.001" />
                  </div>
                  <div class="matrix-row">
                    <input class="in-val" id="im10" type="number" value="0" step="0.001" />
                    <input class="in-val" id="im11" type="number" value="1" step="0.001" />
                    <input class="in-val" id="im12" type="number" value="0" step="0.001" />
                  </div>
                  <div class="matrix-row">
                    <input class="in-val" id="im20" type="number" value="0" step="0.001" />
                    <input class="in-val" id="im21" type="number" value="0" step="0.001" />
                    <input class="in-val" id="im22" type="number" value="1" step="0.001" />
                  </div>
                </div>
              </div>

            </div>
            <!-- END INPUT CARD -->

            <!-- ===== OUTPUT CARD ===== -->
            <div class="card card-half output-card">
              <h2>Output</h2>

              <!-- QUATERNION -->
              <div class="output-block">
                <div class="output-block-title">
                  <span class="output-badge badge-quat">Q</span>
                  Quaternion <span class="output-sub">normalized</span>
                </div>
                <div class="output-grid-4">
                  <div class="out-field"><label>qx</label><input id="outQx" readonly /></div>
                  <div class="out-field"><label>qy</label><input id="outQy" readonly /></div>
                  <div class="out-field"><label>qz</label><input id="outQz" readonly /></div>
                  <div class="out-field"><label>qw</label><input id="outQw" readonly /></div>
                </div>
              </div>

              <div class="output-divider"></div>

              <!-- EULER -->
              <div class="output-block">
                <div class="output-block-title">
                  <span class="output-badge badge-euler">E</span>
                  Euler
                  <select id="outOrder" class="out-order-select">
                    <option>ZYX</option><option>ZXY</option><option>YZX</option>
                    <option>YXZ</option><option>XZY</option><option>XYZ</option>
                  </select>
                  <div class="out-unit-toggle">
                    <label class="out-radio"><input type="radio" name="outAngleUnit" value="deg" checked /><span>deg</span></label>
                    <label class="out-radio"><input type="radio" name="outAngleUnit" value="rad" /><span>rad</span></label>
                  </div>
                </div>
                <div class="output-grid-3">
                  <div class="out-field"><label>X</label><input id="outEulerX" readonly /></div>
                  <div class="out-field"><label>Y</label><input id="outEulerY" readonly /></div>
                  <div class="out-field"><label>Z</label><input id="outEulerZ" readonly /></div>
                </div>
              </div>

              <div class="output-divider"></div>

              <!-- AXIS-ANGLE -->
              <div class="output-block">
                <div class="output-block-title">
                  <span class="output-badge badge-aa">A</span>
                  Axis-Angle
                  <div class="out-unit-toggle">
                    <label class="out-radio"><input type="radio" name="outAngleUnitAA" value="deg" checked /><span>deg</span></label>
                    <label class="out-radio"><input type="radio" name="outAngleUnitAA" value="rad" /><span>rad</span></label>
                  </div>
                </div>
                <div class="output-grid-4">
                  <div class="out-field"><label>ax</label><input id="outAx" readonly /></div>
                  <div class="out-field"><label>ay</label><input id="outAy" readonly /></div>
                  <div class="out-field"><label>az</label><input id="outAz" readonly /></div>
                  <div class="out-field"><label>θ</label><input id="outAngle" readonly /></div>
                </div>
              </div>

              <div class="output-divider"></div>

              <!-- ROTATION MATRIX -->
              <div class="output-block">
                <div class="output-block-title">
                  <span class="output-badge badge-mat">M</span>
                  Rotation Matrix <span class="output-sub">3×3</span>
                </div>
                <div class="output-matrix">
                  <div class="matrix-row">
                    <input id="m00" readonly /><input id="m01" readonly /><input id="m02" readonly />
                  </div>
                  <div class="matrix-row">
                    <input id="m10" readonly /><input id="m11" readonly /><input id="m12" readonly />
                  </div>
                  <div class="matrix-row">
                    <input id="m20" readonly /><input id="m21" readonly /><input id="m22" readonly />
                  </div>
                </div>
              </div>

            </div>
            <!-- END OUTPUT CARD -->

          </div>
          <!-- END TOP ROW -->

          <button id="convertBtn">Convert</button>

        </div>
      </div>
      <!-- END LEFT COLUMN -->

      <div id="viewer"></div>

    </div>

    <script type="module" src="script.js"></script>
  </form>
</body>
</html>
