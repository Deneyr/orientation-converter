<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Orientation Converter</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

<h1>Euler ↔ Quaternion Converter</h1>

<div class="container">

  <!-- PANEL -->
  <div class="panel">

    <h2>Ordre des rotations</h2>

    <select id="rotationOrder">
      <option value="XYZ">XYZ (x → y' → z'')</option>
      <option value="YXZ">YXZ (y → x' → z'')</option>
      <option value="ZXY">ZXY (z → x' → y'')</option>
      <option value="ZYX">ZYX (z → y' → x'')</option>
      <option value="XZY">XZY (x → z' → y'')</option>
      <option value="YZX">YZX (y → z' → x'')</option>
    </select>

    <h2>Unités</h2>

    <label>
      <input type="radio" name="angleMode" value="deg" checked>
      Degrés
    </label>

    <label>
      <input type="radio" name="angleMode" value="rad">
      Radians
    </label>

    <h2>Euler</h2>

    <input id="roll" placeholder="X" type="number" value="0">
    <input id="pitch" placeholder="Y" type="number" value="0">
    <input id="yaw" placeholder="Z" type="number" value="0">

    <h2>Quaternion</h2>

    <input id="qx" placeholder="x" type="number" step="0.001" value="0">
    <input id="qy" placeholder="y" type="number" step="0.001" value="0">
    <input id="qz" placeholder="z" type="number" step="0.001" value="0">
    <input id="qw" placeholder="w" type="number" step="0.001" value="1">

  </div>

  <!-- VIEW -->
  <div id="viewer"></div>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
